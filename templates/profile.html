<!DOCTYPE html><html lang="en">
<head>
    <link rel="manifest" href="/static/manifest.json">
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/static/sw.js");
            });
        }
    </script>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>ParkDirect - User Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
        .brutal-border { border: 3px solid #1a1a1a; }
        .brutal-shadow { box-shadow: 6px 6px 0px 0px #1a1a1a; }
        .brutal-button { border: 3px solid #1a1a1a; box-shadow: 4px 4px 0px 0px #1a1a1a; transition: all 0.2s ease; }
        .brutal-button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px 0px #1a1a1a; }
        .brutal-input { border: 3px solid #1a1a1a; border-radius: 0; }
        .brutal-radio-container input[type="radio"] { display: none; }
        .brutal-radio-container label { display: flex; align-items: center; padding: 12px 16px; border: 3px solid #1a1a1a; background-color: #ffffff; cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-weight: 700; text-transform: uppercase; transition: all 0.2s ease; }
        .brutal-radio-container input[type="radio"]:checked + label { background-color: #ffcc00; box-shadow: 4px 4px 0px 0px #1a1a1a; transform: translate(-4px, -4px); }
    </style>
</head>
<body class="bg-[#f5f0e8] text-[#1a1a1a] font-body antialiased min-h-screen pb-24 flex flex-col">
<header class="w-full top-0 bg-background border-b-4 border-primary shadow-[4px_4px_0px_0px_rgba(26,26,26,1)] z-40 sticky">
<div class="flex items-center justify-between px-6 py-4 w-full"><div class="flex items-center gap-3"><h1 class="text-2xl font-headline font-black text-primary uppercase tracking-tighter">PARKING</h1></div><a class="flex items-center cursor-pointer active:scale-95 transition-transform hover:bg-surface-container-low p-2 rounded-none border-2 hover:border-primary bg-primary-container border-primary" href="#"><span class="material-symbols-outlined text-primary text-2xl">account_circle</span></a></div>
</header>
<main class="flex-1 w-full max-w-3xl mx-auto px-6 py-12 flex flex-col gap-10">
<div class="flex flex-col gap-2">
<h1 class="font-headline font-black text-5xl uppercase tracking-tighter text-primary brutal-shadow bg-[#ffcc00] w-fit px-4 py-2 border-[3px] border-primary inline-block">USER PROFILE</h1>
<p class="font-body text-lg mt-4 max-w-lg font-semibold">Identify yourself and your department for correct slot allocation.</p>
</div>
<div class="bg-white brutal-border p-8 flex flex-col gap-8 brutal-shadow relative">
<form class="flex flex-col gap-8" method="POST">
<div class="flex flex-col gap-6">
<h2 class="font-headline font-black text-2xl uppercase border-b-3 border-primary pb-2 inline-block w-fit">Personal Details</h2>
<div class="grid grid-cols-1 gap-6">
<div class="flex flex-col gap-2">
<label class="font-headline font-bold text-sm uppercase tracking-wide" for="user_name">Full Name</label>
<input class="brutal-input bg-[#eee9e0] p-3 font-body text-primary font-semibold w-full" id="user_name" name="user_name" type="text" value="{{ session.get('user_name', '') }}" required>
</div>
</div>
</div>

<div class="flex flex-col gap-4">
<div class="flex items-center gap-2 mb-2">
<h2 class="font-headline font-black text-2xl uppercase">Department</h2>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<div class="brutal-radio-container relative">
<input id="dept-itsm" name="user_dept" type="radio" value="ITSM" {{ 'checked' if session.get('user_dept') == 'ITSM' else '' }} required>
<label class="w-full flex justify-between items-center h-full" for="dept-itsm">
<span class="">ITSM</span>
<span class="material-symbols-outlined">badge</span>
</label>
</div>
<div class="brutal-radio-container relative">
<input id="dept-qa" name="user_dept" type="radio" value="QA" {{ 'checked' if session.get('user_dept') == 'QA' else '' }} required>
<label class="w-full flex justify-between items-center h-full" for="dept-qa">
<span class="">QA</span>
<span class="material-symbols-outlined">school</span>
</label>
</div>
</div>
</div>

<div class="flex flex-col gap-4 pt-8 border-t-4 border-primary">
    <div class="flex items-center justify-between">
        <div class="flex flex-col">
            <span class="font-headline font-black text-sm uppercase tracking-wide">Administrative Access</span>
        </div>
        <a href="{{ url_for('admin_login') }}" class="brutal-button bg-[#ffcc00] px-4 py-2 flex items-center gap-2 hover:bg-black hover:text-white transition-colors">
            <span class="material-symbols-outlined text-lg">lock</span>
            <span class="font-headline font-black text-xs uppercase">Login as Admin</span>
        </a>
    </div>
</div><div class="flex flex-col sm:flex-row gap-4 mt-8 pt-8 border-primary">
<a href="{{ url_for('index') }}" class="font-headline font-black uppercase text-lg px-8 py-4 bg-white text-primary brutal-button flex-1 text-center hover:bg-[#e8e3da]">
                        CANCEL
                    </a>
<button class="font-headline font-black uppercase text-lg px-8 py-4 brutal-button flex-[2] text-center flex items-center justify-center gap-2 hover:bg-black hover:text-[#ffcc00] bg-[#0055ff] text-white" type="submit">
<span class="material-symbols-outlined">save</span>
                        SAVE CHANGES
                    </button>
</div>
</form>
</div>
</main>
</body></html>
