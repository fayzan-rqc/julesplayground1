<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
    <link rel="manifest" href="/static/manifest.json">
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/static/sw.js");
            });
        }
    </script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ParkDirect Admin Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
        body { background-color: #f5f0e8; }
        .brutal-border { border: 4px solid #1a1a1a; }
    </style>
</head>
<body class="h-full flex flex-col font-body text-[#1a1a1a] antialiased">
<main class="flex-1 flex items-center justify-center p-6 relative overflow-hidden">
<div class="w-full max-w-md relative z-10">
<div class="bg-white brutal-border shadow-[10px_10px_0px_0px_#1a1a1a] p-8 md:p-12 relative flex flex-col gap-8">
<div class="absolute top-0 left-0 w-full h-4 bg-[#ffcc00] border-b-4 border-[#1a1a1a]"></div>
<div class="text-center mt-4">
<h1 class="font-headline font-black text-4xl md:text-5xl uppercase tracking-tighter text-[#1a1a1a] mb-2">ADMIN ACCESS</h1>
<p class="font-body text-sm md:text-base font-medium">Secure portal for system controllers</p>
</div>
<form class="flex flex-col gap-6" action="{{ url_for('admin_dashboard') }}">
<div class="flex flex-col gap-2">
<label class="font-bold text-sm uppercase tracking-wide flex items-center gap-2" for="username">
<span class="material-symbols-outlined text-[18px]">person</span> Username / Email
</label>
<input class="w-full bg-[#f5f0e8] p-4 brutal-border font-body text-[#1a1a1a] rounded-none focus:ring-0" id="username" name="username" placeholder="Enter credentials" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-bold text-sm uppercase tracking-wide flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-[18px]">key</span> Password
</label>
<input class="w-full bg-[#f5f0e8] p-4 brutal-border font-body text-[#1a1a1a] rounded-none focus:ring-0" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<button class="mt-4 w-full bg-[#ffcc00] text-[#1a1a1a] font-headline font-black text-xl md:text-2xl uppercase py-5 brutal-border shadow-[6px_6px_0px_0px_#1a1a1a] hover:bg-black hover:text-[#ffcc00] transition-all duration-200" type="submit">
                        LOGIN TO PORTAL
                    </button>
</form>
</div>
</div>
</main>
</body></html>
